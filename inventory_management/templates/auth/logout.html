{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Logout - La Carretilla" %}</title>
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">

    <!-- Plugins css -->
    <link href="{% static 'assets/libs/flatpickr/flatpickr.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'assets/libs/selectize/css/selectize.bootstrap3.css' %}" rel="stylesheet" type="text/css" />

    <!-- Theme Config Js -->
    <script src="{% static 'assets/js/head.js' %}"></script>

    <!-- Bootstrap css -->
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" id="app-style" />

    <!-- App css -->
    <link href="{% static 'assets/css/app.min.css' %}" rel="stylesheet" type="text/css" />

    <!-- Icons css -->
    <link href="{% static 'assets/css/icons.min.css' %}" rel="stylesheet" type="text/css" />

    <!-- Custom css -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" type="text/css" />
</head>
<body class="authentication-bg authentication-bg-pattern">

    <div class="account-pages mt-5 mb-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-4">
                    <div class="card bg-pattern shadow-lg border-0 rounded-3">

                        <div class="card-body p-4">

                            <div class="text-center w-75 m-auto">
                                <div class="auth-brand mb-3">
                                    <a class="logo logo-dark text-center d-block">
                                        <span class="logo-lg">
                                            <h1 class="fw-bold">La Carretilla</h1>
                                        </span>
                                    </a>
                                    <a class="logo logo-light text-center d-block">
                                        <span class="logo-lg">
                                            <img src="{% static 'assets/images/logo-light.png' %}" alt="logo" height="22">
                                        </span>
                                    </a>
                                </div>
                                <p class="text-muted mb-4 mt-3 fs-5">{% trans "You've just logged out" %}</p>
                            </div>

                            <div class="text-center d-grid">
                                <a class="btn btn-primary btn-lg fw-semibold" href="{% url 'login' %}">
                                    {% trans "Log in Again" %}
                                </a>
                            </div>

                            {% if messages %}
                            <ul class="messages mt-3">
                                {% for message in messages %}
                                <li class="alert alert-{{ message.tags }} mt-2">{{ message }}</li>
                                {% endfor %}
                            </ul>
                            {% endif %}

                        </div> <!-- end card-body -->
                    </div>
                    <!-- end card -->
                </div> <!-- end col -->
            </div>
            <!-- end row -->
        </div>
        <!-- end container -->
    </div>
    <!-- end page -->

    <div class="footer footer-alt text-center mt-4">
        {% include 'layouts/partials/footer.html' %}
    </div>

</body>
</html>
