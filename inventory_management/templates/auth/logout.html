{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ✅ Responsivo -->
    <title>{% trans "Logout - La Carretilla" %}</title>
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'assets/css/app.min.css' %}" rel="stylesheet" />
    <link href="{% static 'assets/css/icons.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    <style>
        .header-title {
            font-size: 1.5em;
            font-weight: 500;
            margin-bottom: 1em;
            color: #323232;
        }
    </style>
</head>
<body class="authentication-bg authentication-bg-pattern">

<div class="account-pages mt-5 mb-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4"> <!-- ✅ Responsive -->
                <div class="card bg-pattern">
                    <div class="card-body p-4 text-center">

                        <div class="auth-brand mb-3">
                            <h1>La Carretilla</h1>
                        </div>

                        <p class="text-muted mb-4 header-title">{% trans "You've just logged out" %}</p>

                        <a class="btn btn-primary btn-sm" href="{% url 'login' %}">{% trans "Log in Again" %}</a>

                        {% if messages %}
                            <ul class="messages mt-3">
                                {% for message in messages %}
                                    <li class="{{ message.tags }}">{{ message }}</li>
                                {% endfor %}
                            </ul>
                        {% endif %}

                    </div> <!-- end card-body -->
                </div> <!-- end card -->
            </div> <!-- end col -->
        </div> <!-- end row -->
    </div> <!-- end container -->
</div> <!-- end account-pages -->

<div class="footer footer-alt text-center">
    {% include 'layouts/partials/footer.html' %}
</div>

</body>
</html>
