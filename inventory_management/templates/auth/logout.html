{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Cerrar Sesión" %}</title>
    <link rel="stylesheet " href="{% static 'bootstrap-5.3.3-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/btns-styles.css' %}">

</head>
<body>
    <div class="form-check">
        <h1 class="header-title">{% trans "You've just logged out" %}</h1>
        <form method="post" action="">
            {% csrf_token %}
            <button type="submit">{% trans "Cerrar Sesión" %}</button>
        </form>
        <a class="button" href="{% url 'login' %}">{% trans "Iniciar Sesión Nuevamente" %}</a>
    </div>
</body>
</html>
