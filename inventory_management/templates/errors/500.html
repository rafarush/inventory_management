{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Error 500 - Internal Server Error" %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100 text-center bg-light">
    <div>
        <h1 class="display-1 text-danger fw-bold">500</h1>
        <h2 class="mb-3">{% trans "Internal Server Error" %}</h2>
        <p class="text-muted">{% trans "Something went wrong on our end. Please try again later." %}</p>
        <a href="/" class="btn btn-outline-primary mt-3">{% trans "Return to home" %}</a>
    </div>
</body>
</html>
