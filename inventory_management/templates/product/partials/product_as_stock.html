{% load static %}

<div class="card mb-3 shadow-sm">
    <div class="row g-0">
        <div class="col-md-4 text-center">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid rounded-start" alt="Product image">
            {% else %}
                <img src="{% static 'assets/images/no-image.jpg' %}" class="img-fluid rounded-start" alt="No image">
            {% endif %}
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <a href="{% url 'product_detail' pk=product.id %}" class="text-decoration-none text-dark">
                    <h5 class="card-title fw-bold">{{ product.name }}</h5>
                </a>
                <p class="card-text mb-1"><strong>Price:</strong> ${{ product.price }} CUP</p>
                <p class="card-text mb-1">
                    <strong>Stock:</strong>
                    {% if product.stock > 0 %}
                        <span class="badge bg-success">{{ product.stock }}</span>
                    {% else %}
                        <span class="badge bg-danger">Out of stock</span>
                    {% endif %}
                </p>
                <p class="card-text mb-1"><strong>Amount:</strong> {{ product.amount }}</p>
            </div>
        </div>
    </div>
</div>
