{% load static %}

<table class="table">
        <thead>
            <tr>
                <th scope="col">Product</th>
                <th scope="col">Price</th>
                <th scope="col">Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <td><a href="{% url 'product_detail' pk=product.id%}">{{ product.name }}</a></td>
                    <td>{{ product.price }}</td>
                    <td>{{ product.stock }}</td>
                </tr>
            {% empty %}
                <h3>No products to display</h3>
            {% endfor %}
        </tbody>

</table>
