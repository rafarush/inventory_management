{% extends "layouts/base/base.html" %}
{% block title %}
	Product Form
{% endblock %}


{% block content %}

    <a class="btn btn-secondary btn-sm" href="{% url 'product_list' %}" style="margin-top: 20px; margin-bottom: 20px">Back</a>
    <div>
        <form action="" class="form-control" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" class="btn btn-success btn-sm" value="Submit">
        </form>
    </div>


{% endblock %}
