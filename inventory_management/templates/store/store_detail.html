{% extends "layouts/base/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Detalles del Almacén</h2>
  <p><strong>Nombre:</strong> {{ store.name }}</p>
  <p><strong>Dinero propio:</strong> {{ store.own_money }}</p>
  <p><strong>Dinero del negocio:</strong> {{ store.money_business }}</p>
  <p><strong>Porcentaje:</strong> {{ store.percent }}</p>

  <a href="{% url 'store_update' %}" class="btn btn-primary">Editar</a>
</div>
{% endblock %}
