{% load i18n %}
{% load widget_tweaks %}


{% block content %}
<div class="container py-4">

    <!-- Card principal -->
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold text-primary">
                <i class="bi bi-pencil-square me-2"></i> {% block header %}{% trans "Form" %}{% endblock %}
            </h4>
        </div>
        <hr class="m-0">

        <div class="card-body px-4 py-4">
            <form action="{{ action_url }}" method="POST" enctype="multipart/form-data" class="row g-4">
                {% csrf_token %}

                {% for field in form %}
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">{{ field.label }}:</label>
                        {{ field|add_class:"form-control" }}
                        {% if field.help_text %}
                            <small class="form-text text-muted">{{ field.help_text }}</small>
                        {% endif %}
                        <!-- Div de error vacío, se llenará por JS -->
                        <div class="invalid-feedback d-block"></div>
                    </div>
                {% endfor %}

                <div class="col-12 text-end mt-3">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-check-circle me-1"></i> {% block submit_text %}{% trans "Submit" %}{% endblock %}
                    </button>
                    <a href="{% url 'worker_list' %}" class="btn btn-outline-secondary px-4 ms-2">
                        <i class="bi bi-x-circle me-1"></i> {% trans "Cancel" %}
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
