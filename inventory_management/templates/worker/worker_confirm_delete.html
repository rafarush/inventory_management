{% extends "layouts/base/base.html" %}
{% load static %}

{% block title %}
    Delete Confirmation: {{ worker.name }}
{% endblock %}

{% block content %}
    <h1>Are you sure you want to delete: {{ worker.name }}?</h1>

    <form method="post">
        {% csrf_token %}
        <input type="submit" class="btn btn-danger btn-sm" value="Confirm Delete">
        <button type="button" class="btn btn-info btn-sm" onclick="window.location.href='{% url 'worker_list' %}'">Cancel</button>
    </form>

{% endblock %}
