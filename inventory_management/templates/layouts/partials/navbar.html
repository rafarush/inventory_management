{% load i18n %}
{% load static %}

<div class="navbar-custom">
    <div class="topbar">
        <div class="topbar-menu d-flex align-items-center gap-1 justify-content-between w-100">

            <!-- Sidebar Menu Toggle Button -->
            <button id="toggle-menu-btn" class="button-toggle-menu">
                <i class="mdi mdi-menu"></i>
            </button>
            {% if not is_client %}
                <!-- Dropdown Menu -->
                <div class="dropdown d-none d-xl-block">
                    <a class="nav-link dropdown-toggle waves-effect waves-light" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="false" aria-expanded="false">
                        {% trans "Create New" %}
                        <i class="mdi mdi-chevron-down ms-1"></i>
                    </a>
                    <div class="dropdown-menu">
                        <!-- items -->
                    </div>
                </div>
            {% endif %}

            <!-- Language toggle flag -->
            <div id="language-toggle" class="ms-auto d-flex align-items-center" style="cursor:pointer;">
                <img id="flag-icon" src="{% static 'assets/images/flags/es.png' %}" alt="Spain Flag" style="width:24px; height:24px;">
            </div>

            <!-- User Dropdown -->
            <li class="dropdown" style="list-style-type: none;">
                <a class="nav-link dropdown-toggle nav-user me-0 waves-effect waves-light" data-bs-toggle="dropdown" role="button" aria-haspopup="false" aria-expanded="false">
                    <img src="{% static 'assets/images/users/default-user.png' %}" alt="user-image" class="rounded-circle">
                    <span class="ms-1 d-none d-md-inline-block">
                        {{ user.username }} <i class="mdi mdi-chevron-down"></i>
                    </span>
                </a>
                <div class="dropdown-menu dropdown-menu-end profile-dropdown ">

                    <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item notify-item">
                            <i class="fe-log-out"></i>
                            <span>{% trans "Log out" %}</span>
                        </button>
                    </form>

                </div>
            </li>
        </div>
    </div>
</div>

<script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    let currentLang = getCookie('django_language') || 'en';

    const flagIcon = document.getElementById('flag-icon');
    const languageToggle = document.getElementById('language-toggle');

    function updateFlag() {
      flagIcon.src = {
        'es': "{% static 'assets/images/flags/es.png' %}",
        'en': "{% static 'assets/images/flags/gb.png' %}"
      }[currentLang];
      flagIcon.alt = currentLang === 'es' ? 'UK Flag' : 'Spanish Flag';
    }

    updateFlag();

    languageToggle.addEventListener('click', () => {
      currentLang = currentLang === 'es' ? 'en' : 'es';
      updateFlag();

      const formData = new FormData();
      formData.append('language', currentLang);
      formData.append('next', window.location.pathname);

      fetch('/i18n/setlang/', {
        method: 'POST',
        body: formData,
        headers: {
          'X-CSRFToken': getCookie('csrftoken'),
        },
      }).then(() => {
        window.location.reload();
      });
    });
