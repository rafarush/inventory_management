{% extends "layouts/base/base.html" %}
{% load i18n %}
{% load static %}
{% block title %}
    {% trans "Delete Confirmation: " %}
{% endblock %}


{% block content %}
	<h1>{% trans "Are you sure you want to delete: " %}?</h1>

    <form method="post">
        {% csrf_token %}
        <input type="submit" class="btn btn-danger btn-sm" value="{% trans "Confirm Delete" %}">
        <button type="button" class="btn btn-info btn-sm" onclick="window.location.href='{% url 'wastage_record_list' %}'">{% trans "Cancel" %}</button>
    </form>

{% endblock %}
