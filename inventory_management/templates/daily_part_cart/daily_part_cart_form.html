{% extends "layouts/base/base.html" %}

{% block title %}
    Daily Part Cart Form
{% endblock %}

{% block content %}

<a class="btn btn-secondary btn-sm mb-3" href="{% url 'daily_part_cart_list' %}">Volver</a>

<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h5 class="mb-0">Formulario Daily Part Cart</h5>
    </div>
    <div class="card-body">
        <form action="" method="POST">
            {% csrf_token %}
            
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="id_worker" class="form-label">Worker</label>
                    {{ form.worker }}
                </div>
                <div class="col-md-4">
                    <label for="id_cart" class="form-label">Cart</label>
                    {{ form.cart }}
                </div>
                <div class="col-md-4">
                    <label for="id_worker_payment" class="form-label">Pago al Worker</label>
                    {{ form.worker_payment }}
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-success">Guardar</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
